services:
  - type: web
    name: cashflow-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: LLM_ORDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: BASE_URL
        sync: false
      - key: DASH_PASSWORD
        sync: false
